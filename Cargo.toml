[package]
name = "graffalo-agent-bridge"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false
license = "MIT"
description = "Local companion connecting Graffalo to installed Codex and Grok Build agents"
repository = "https://github.com/monomyth/graffalo-agent-bridge"
rust-version = "1.89"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
